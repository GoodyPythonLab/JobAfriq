name: Scrape jobs

on:
  schedule:
    # Every 60 minutes (UTC). Minute 17 avoids GitHub's busy top-of-the-hour queue.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs overlap; a new run waits for the current one to finish.
concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          # Empty when the secret isn't set -> the scraper uses its built-in summaries.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional repository variable to override the default Gemini model.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python -m scraper --report "$RUNNER_TEMP/report.json"

      - name: Add run report to job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/report.json" ]; then
            {
              echo '### Scrape report'
              echo '```json'
              cat "$RUNNER_TEMP/report.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push changes
        # Also runs if the scraper exited with an error, so pruning of old jobs is still saved.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): update job listings [bot]"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt); rebasing on latest main and retrying..."
            git pull --rebase
          done
          exit 1
